name: Hub API CI/CD

on:
  push:
    branches: [main]
    paths:
      - 'api/**'
      - 'agent/**'
      - 'docker/**'
      - 'assessment-engine/**'
      - '.github/workflows/api-deploy.yml'
  pull_request:
    branches: [main]
    paths:
      - 'api/**'
      - 'agent/**'

env:
  ACR_NAME: ${{ secrets.ACR_NAME }}
  CONTAINER_APP_NAME: ${{ secrets.CONTAINER_APP_NAME }}
  RESOURCE_GROUP: ${{ secrets.AZURE_RESOURCE_GROUP }}

jobs:
  test:
    runs-on: ubuntu-latest
    name: Test API
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'
          cache-dependency-path: tests/requirements-test.txt

      - name: Install test dependencies
        run: pip install -r tests/requirements-test.txt

      - name: Run tests
        run: pytest tests/ -v --tb=short
        env:
          API_KEY: test-key

  build_and_push:
    needs: test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    name: Build & Push Hub Image
    steps:
      - uses: actions/checkout@v4

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Login to ACR
        run: az acr login --name ${{ env.ACR_NAME }}

      - name: Build and push hub image
        run: |
          IMAGE="${{ env.ACR_NAME }}.azurecr.io/db-migration-hub:${{ github.sha }}"
          docker build -f docker/Dockerfile -t "$IMAGE" -t "${{ env.ACR_NAME }}.azurecr.io/db-migration-hub:latest" .
          docker push "$IMAGE"
          docker push "${{ env.ACR_NAME }}.azurecr.io/db-migration-hub:latest"

      - name: Deploy to Container Apps
        run: |
          az containerapp update \
            --name ${{ env.CONTAINER_APP_NAME }} \
            --resource-group ${{ env.RESOURCE_GROUP }} \
            --image "${{ env.ACR_NAME }}.azurecr.io/db-migration-hub:${{ github.sha }}"
