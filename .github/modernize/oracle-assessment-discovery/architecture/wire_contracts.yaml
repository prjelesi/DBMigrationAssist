    unit: agent-result-submission
    type: rest
    stability: frozen
    source_loc: "src/backend/AssessmentToolkit.Api/Controllers/AgentJobsController.cs:80"
    contract:
      method: POST
      path: "/api/agent/{agentId}/results"
      request: "signed agent result payload"
      response: "accepted persisted result"
      error: "agent, job, signature and payload validation statuses"
      auth: "HMAC-SHA256 agent authentication"
    target_contract:
      method: "POST /api/agent/{agentId}/results"
      notes: "Existing agents remain compatible; baseline processing occurs after validated persistence."
    semantic_divergence: []
  - name: questionnaire-responses
    unit: questionnaire-api
