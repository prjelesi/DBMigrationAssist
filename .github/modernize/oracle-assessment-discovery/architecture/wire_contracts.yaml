contracts:
  - name: oracle-plugin-result
    unit: oracle-collector
    type: sdk
    stability: must_preserve
    source_loc: "src/agent/AssessmentToolkit.Agent/Plugins/OraclePlugin.cs:32"
    contract:
      method: "RunAsync"
      path: "pluginId=oracle"
      request: "PluginContext with host, port, service/database and credentials"
      response: "PluginResult with success state, FindingJson and section errors"
      error: "Connection failure returns unsuccessful plugin result; section failures are recorded individually"
      auth: "Database credentials resolved locally by agent"
    target_contract:
      method: "Task<PluginResult> RunAsync(PluginContext, CancellationToken)"
      notes: "Preserve existing plugin contract and add only versioned evidence fields."
    semantic_divergence: []
