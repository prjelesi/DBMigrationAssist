    contract:
      method: "GET/POST/PUT"
      path: "/api/questionnaires/responses*"
      request: "project/database scope, template and typed answers"
      response: "response, answers, validation and submission state"
      error: "400 validation, 403 authorization, 404 missing response"
      auth: "portal cookie plus antiforgery for mutations"
    target_contract:
      method: "Existing routes plus evidence attribution/completeness fields"
      notes: "Preserve current drafts and database-scoped uniqueness."
    semantic_divergence: []
  - name: graph-edges
    unit: graph-api
