#cloud-config
package_update: true
package_upgrade: false

packages:
  - curl
  - docker.io
  - docker-compose-v2
  - jq

write_files:
  - path: /usr/local/sbin/bootstrap-dbmigration-engines.sh
    permissions: '0700'
    owner: root:root
    content: |
      #!/usr/bin/env bash
      set -Eeuo pipefail
      exec > >(tee -a /var/log/dbmigration-engine-bootstrap.log) 2>&1

      lab_root=/opt/dbmigration-lab
      data_root=/srv/dbmigration-data
      ready_file="$lab_root/READY"
      key_vault_name='__KEY_VAULT_NAME__'
      identity_client_id='__IDENTITY_CLIENT_ID__'

      if [[ -f "$ready_file" ]]; then
        exit 0
      fi

      mkdir -p "$lab_root" "$data_root"
      data_device=''
      for attempt in {1..60}; do
        for candidate in /dev/disk/azure/data/by-lun/0 /dev/disk/azure/scsi1/lun0; do
          if [[ -b "$candidate" ]]; then
            data_device="$candidate"
            break 2
          fi
        done
        for candidate in /dev/nvme*n*; do
          [[ -b "$candidate" ]] || continue
          [[ $(lsblk -dn -o TYPE "$candidate") == disk ]] || continue
          [[ $(lsblk -nr -o NAME "$candidate" | wc -l) -eq 1 ]] || continue
          [[ $(udevadm info --query=property --name "$candidate" 2>/dev/null) == *'ID_MODEL=MSFT NVMe Accelerator'* ]] || continue
          data_device="$candidate"
          break 2
        done
        sleep 2
      done
      [[ -n "$data_device" && -b "$data_device" ]]
      if ! blkid "$data_device" >/dev/null 2>&1; then
        mkfs.ext4 -F "$data_device"
      fi
      data_uuid=$(blkid -s UUID -o value "$data_device")
      grep -q "UUID=$data_uuid" /etc/fstab || echo "UUID=$data_uuid $data_root ext4 defaults,nofail 0 2" >> /etc/fstab
      mountpoint -q "$data_root" || mount "$data_root"

      token=''
      for attempt in {1..30}; do
        token=$(curl --fail --silent --show-error --get \
          --header Metadata:true \
          --data-urlencode api-version=2018-02-01 \
          --data-urlencode resource=https://vault.azure.net \
          --data-urlencode client_id="$identity_client_id" \
          http://169.254.169.254/metadata/identity/oauth2/token | jq -r '.access_token // empty') || true
        [[ -n "$token" ]] && break
        sleep 10
      done
      [[ -n "$token" ]]

      database_password=$(curl --fail --silent --show-error \
        --header "Authorization: Bearer $token" \
        "https://$key_vault_name.vault.azure.net/secrets/database-admin-password?api-version=7.4" | jq -r '.value')
      [[ -n "$database_password" && "$database_password" != null ]]
      export DB_PASSWORD="$database_password"

      install -d -m 0700 /etc/dbmigration-lab
      printf 'DB_PASSWORD_B64=%s\n' "$(printf '%s' "$database_password" | base64 -w0)" > /etc/dbmigration-lab/credentials
      chmod 0600 /etc/dbmigration-lab/credentials

      for engine in sqlserver postgresql mysql mongodb cassandra; do
        install -d -m 0750 "$data_root/$engine"
      done
      chown 10001:0 "$data_root/sqlserver"

      cat > "$lab_root/docker-compose.yml" <<'COMPOSE'
      services:
        sqlserver:
          image: mcr.microsoft.com/mssql/server:2019-latest
          container_name: dbmlab-sqlserver
          environment:
            ACCEPT_EULA: Y
            MSSQL_PID: Developer
            MSSQL_SA_PASSWORD: ${DB_PASSWORD}
          ports: ["1433:1433"]
          volumes: ["/srv/dbmigration-data/sqlserver:/var/opt/mssql"]
          mem_limit: 2g
          restart: unless-stopped
        postgresql:
          image: postgres:14-alpine
          container_name: dbmlab-postgresql
          environment:
            POSTGRES_DB: migration_lab
            POSTGRES_USER: lab_admin
            POSTGRES_PASSWORD: ${DB_PASSWORD}
          ports: ["5432:5432"]
          volumes: ["/srv/dbmigration-data/postgresql:/var/lib/postgresql/data"]
          mem_limit: 768m
          restart: unless-stopped
        mysql:
          image: mysql:8.0
          container_name: dbmlab-mysql
          environment:
            MYSQL_DATABASE: migration_lab
            MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
          ports: ["3306:3306"]
          volumes: ["/srv/dbmigration-data/mysql:/var/lib/mysql"]
          mem_limit: 1g
          restart: unless-stopped
        mongodb:
          image: mongo:6.0
          container_name: dbmlab-mongodb
          environment:
            MONGO_INITDB_ROOT_USERNAME: lab_admin
            MONGO_INITDB_ROOT_PASSWORD: ${DB_PASSWORD}
          ports: ["27017:27017"]
          volumes: ["/srv/dbmigration-data/mongodb:/data/db"]
          mem_limit: 768m
          restart: unless-stopped
        cassandra:
          image: cassandra:4.1
          container_name: dbmlab-cassandra
          environment:
            CASSANDRA_CLUSTER_NAME: MigrationLab
            CASSANDRA_DC: dc1
            CASSANDRA_ENDPOINT_SNITCH: GossipingPropertyFileSnitch
            MAX_HEAP_SIZE: 768M
            HEAP_NEWSIZE: 200M
          ports: ["9042:9042"]
          volumes: ["/srv/dbmigration-data/cassandra:/var/lib/cassandra"]
          mem_limit: 1536m
          restart: unless-stopped
      COMPOSE

      cd "$lab_root"
      docker compose pull
      docker compose up -d

      retry() {
        local description="$1"
        shift
        for attempt in {1..90}; do
          if "$@"; then
            return 0
          fi
          sleep 10
        done
        echo "Timed out waiting for $description" >&2
        return 1
      }

      sqlcmd() {
        local tool
        tool=$(docker exec dbmlab-sqlserver sh -c 'command -v /opt/mssql-tools18/bin/sqlcmd || command -v /opt/mssql-tools/bin/sqlcmd')
        docker exec dbmlab-sqlserver "$tool" -C -S localhost -U sa -P "$DB_PASSWORD" "$@"
      }
      retry 'SQL Server' sqlcmd -Q 'SELECT 1'
      sqlcmd -Q "IF DB_ID('MigrationLab') IS NULL CREATE DATABASE MigrationLab"
      sqlcmd -d MigrationLab -Q "
        IF OBJECT_ID('dbo.departments') IS NULL CREATE TABLE dbo.departments (department_id int PRIMARY KEY, name nvarchar(80) NOT NULL UNIQUE);
        IF OBJECT_ID('dbo.employees') IS NULL CREATE TABLE dbo.employees (employee_id int IDENTITY PRIMARY KEY, department_id int NOT NULL REFERENCES dbo.departments(department_id), name nvarchar(100) NOT NULL, salary decimal(12,2), hire_date date, profile_xml xml, row_version rowversion);
        IF NOT EXISTS (SELECT 1 FROM dbo.departments) INSERT dbo.departments VALUES (10,'Engineering'),(20,'Finance'),(30,'Operations');
        IF NOT EXISTS (SELECT 1 FROM dbo.employees) INSERT dbo.employees(department_id,name,salary,hire_date,profile_xml) VALUES (10,'Alice Smith',95000,'2019-03-15','<skills><skill>Azure</skill></skills>'),(20,'Eve Torres',88000,'2017-05-30','<skills><skill>Analytics</skill></skills>'),(30,'Ravi Kumar',79000,'2022-09-12','<skills><skill>ERP</skill></skills>');
        IF OBJECT_ID('dbo.v_employee_summary') IS NULL EXEC('CREATE VIEW dbo.v_employee_summary AS SELECT e.employee_id,e.name,d.name department,e.salary FROM dbo.employees e JOIN dbo.departments d ON d.department_id=e.department_id');
        IF NOT EXISTS (SELECT 1 FROM sys.server_principals WHERE name='assessment_reader') BEGIN CREATE LOGIN assessment_reader WITH PASSWORD='${DB_PASSWORD}'; END;
        IF NOT EXISTS (SELECT 1 FROM sys.database_principals WHERE name='assessment_reader') CREATE USER assessment_reader FOR LOGIN assessment_reader;
        ALTER ROLE db_datareader ADD MEMBER assessment_reader;"
      [[ $(sqlcmd -h -1 -W -d MigrationLab -Q 'SET NOCOUNT ON; SELECT COUNT(*) FROM dbo.employees' | tr -d '\r[:space:]') == 3 ]]

      retry 'PostgreSQL' docker exec dbmlab-postgresql pg_isready -U lab_admin -d migration_lab
      docker exec -i -e PGPASSWORD="$DB_PASSWORD" dbmlab-postgresql psql -v ON_ERROR_STOP=1 -U lab_admin -d migration_lab <<SQL
      CREATE SCHEMA IF NOT EXISTS hr;
      CREATE TABLE IF NOT EXISTS hr.departments (department_id integer PRIMARY KEY, name varchar(80) NOT NULL UNIQUE);
      CREATE TABLE IF NOT EXISTS hr.employees (employee_id bigint GENERATED ALWAYS AS IDENTITY PRIMARY KEY, department_id integer REFERENCES hr.departments, name varchar(100) NOT NULL, salary numeric(12,2), hire_date date, attributes jsonb);
      INSERT INTO hr.departments VALUES (10,'Engineering'),(20,'Finance'),(30,'Operations') ON CONFLICT DO NOTHING;
      INSERT INTO hr.employees(department_id,name,salary,hire_date,attributes) SELECT * FROM (VALUES (10,'Alice Smith',95000.00,DATE '2019-03-15','{"skills":["Azure","PostgreSQL"]}'::jsonb),(20,'Eve Torres',88000.00,DATE '2017-05-30','{"skills":["Analytics"]}'::jsonb),(30,'Ravi Kumar',79000.00,DATE '2022-09-12','{"skills":["ERP"]}'::jsonb)) seed WHERE NOT EXISTS (SELECT 1 FROM hr.employees);
      CREATE INDEX IF NOT EXISTS ix_employees_attributes ON hr.employees USING gin(attributes);
      DO \$\$ BEGIN IF NOT EXISTS (SELECT FROM pg_roles WHERE rolname='assessment_reader') THEN CREATE ROLE assessment_reader LOGIN PASSWORD '${DB_PASSWORD}'; END IF; END \$\$;
      GRANT CONNECT ON DATABASE migration_lab TO assessment_reader;
      GRANT USAGE ON SCHEMA hr TO assessment_reader;
      GRANT SELECT ON ALL TABLES IN SCHEMA hr TO assessment_reader;
      ALTER DEFAULT PRIVILEGES IN SCHEMA hr GRANT SELECT ON TABLES TO assessment_reader;
      SQL
      [[ $(docker exec -e PGPASSWORD="$DB_PASSWORD" dbmlab-postgresql psql -At -U lab_admin -d migration_lab -c 'SELECT count(*) FROM hr.employees') == 3 ]]

      retry 'MySQL' docker exec dbmlab-mysql mysqladmin ping -uroot -p"$DB_PASSWORD" --silent
      docker exec -i dbmlab-mysql mysql -uroot -p"$DB_PASSWORD" <<SQL
      CREATE DATABASE IF NOT EXISTS migration_lab;
      USE migration_lab;
      CREATE TABLE IF NOT EXISTS departments (department_id int PRIMARY KEY, name varchar(80) NOT NULL UNIQUE);
      CREATE TABLE IF NOT EXISTS employees (employee_id bigint AUTO_INCREMENT PRIMARY KEY, department_id int, name varchar(100) NOT NULL, salary decimal(12,2), hire_date date, attributes json, CONSTRAINT fk_employee_department FOREIGN KEY (department_id) REFERENCES departments(department_id), INDEX ix_employee_department(department_id));
      INSERT IGNORE INTO departments VALUES (10,'Engineering'),(20,'Finance'),(30,'Operations');
      INSERT INTO employees(department_id,name,salary,hire_date,attributes) SELECT 10,'Alice Smith',95000,'2019-03-15',JSON_OBJECT('skills',JSON_ARRAY('Azure','MySQL')) WHERE NOT EXISTS (SELECT 1 FROM employees);
      INSERT INTO employees(department_id,name,salary,hire_date,attributes) SELECT 20,'Eve Torres',88000,'2017-05-30',JSON_OBJECT('skills',JSON_ARRAY('Analytics')) WHERE (SELECT COUNT(*) FROM employees)=1;
      INSERT INTO employees(department_id,name,salary,hire_date,attributes) SELECT 30,'Ravi Kumar',79000,'2022-09-12',JSON_OBJECT('skills',JSON_ARRAY('ERP')) WHERE (SELECT COUNT(*) FROM employees)=2;
      CREATE USER IF NOT EXISTS 'assessment_reader'@'%' IDENTIFIED BY '${DB_PASSWORD}';
      GRANT SELECT, SHOW VIEW ON migration_lab.* TO 'assessment_reader'@'%';
      FLUSH PRIVILEGES;
      SQL
      [[ $(docker exec dbmlab-mysql mysql -N -uroot -p"$DB_PASSWORD" -e 'SELECT COUNT(*) FROM migration_lab.employees') == 3 ]]

      retry 'MongoDB' docker exec dbmlab-mongodb mongosh --quiet -u lab_admin -p "$DB_PASSWORD" --authenticationDatabase admin --eval "db.adminCommand('ping').ok"
      docker exec -e DB_PASSWORD="$DB_PASSWORD" dbmlab-mongodb mongosh --quiet -u lab_admin -p "$DB_PASSWORD" --authenticationDatabase admin --eval '
        const target = db.getSiblingDB("migration_lab");
        if (target.departments.countDocuments({}) === 0) target.departments.insertMany([{departmentId:10,name:"Engineering"},{departmentId:20,name:"Finance"},{departmentId:30,name:"Operations"}]);
        if (target.employees.countDocuments({}) === 0) target.employees.insertMany([{employeeId:1,departmentId:10,name:"Alice Smith",salary:95000,hireDate:ISODate("2019-03-15"),skills:["Azure","MongoDB"]},{employeeId:2,departmentId:20,name:"Eve Torres",salary:88000,hireDate:ISODate("2017-05-30"),skills:["Analytics"]},{employeeId:3,departmentId:30,name:"Ravi Kumar",salary:79000,hireDate:ISODate("2022-09-12"),skills:["ERP"]}]);
        target.employees.createIndex({departmentId:1});
        if (!target.getUser("assessment_reader")) target.createUser({user:"assessment_reader",pwd:process.env.DB_PASSWORD,roles:[{role:"read",db:"migration_lab"}]});
        if (target.employees.countDocuments({}) !== 3) throw new Error("MongoDB verification failed");'

      retry 'Cassandra' docker exec dbmlab-cassandra cqlsh -e 'DESCRIBE CLUSTER'
      docker exec -i dbmlab-cassandra cqlsh <<CQL
      CREATE KEYSPACE IF NOT EXISTS migration_lab WITH replication = {'class':'SimpleStrategy','replication_factor':1};
      CREATE TABLE IF NOT EXISTS migration_lab.departments (department_id int PRIMARY KEY, name text);
      CREATE TABLE IF NOT EXISTS migration_lab.employees (employee_id uuid PRIMARY KEY, department_id int, name text, salary decimal, hire_date date, skills set<text>);
      INSERT INTO migration_lab.departments (department_id,name) VALUES (10,'Engineering');
      INSERT INTO migration_lab.departments (department_id,name) VALUES (20,'Finance');
      INSERT INTO migration_lab.departments (department_id,name) VALUES (30,'Operations');
      INSERT INTO migration_lab.employees (employee_id,department_id,name,salary,hire_date,skills) VALUES (11111111-1111-1111-1111-111111111111,10,'Alice Smith',95000,'2019-03-15',{'Azure','Cassandra'});
      INSERT INTO migration_lab.employees (employee_id,department_id,name,salary,hire_date,skills) VALUES (22222222-2222-2222-2222-222222222222,20,'Eve Torres',88000,'2017-05-30',{'Analytics'});
      INSERT INTO migration_lab.employees (employee_id,department_id,name,salary,hire_date,skills) VALUES (33333333-3333-3333-3333-333333333333,30,'Ravi Kumar',79000,'2022-09-12',{'ERP'});
      CQL
      [[ $(docker exec dbmlab-cassandra cqlsh -e 'SELECT COUNT(*) FROM migration_lab.employees' | awk '/^[[:space:]]*[0-9]+[[:space:]]*$/{gsub(/ /,""); print; exit}') == 3 ]]

      unset database_password DB_PASSWORD token
      printf 'ready=%s\nengines=sqlserver,postgresql,mysql,mongodb,cassandra\n' "$(date --iso-8601=seconds)" > "$ready_file"

runcmd:
  - systemctl enable --now docker
  - usermod -aG docker __ADMIN_USERNAME__
  - /usr/local/sbin/bootstrap-dbmigration-engines.sh

final_message: 'Database migration multi-engine host bootstrap finished.'