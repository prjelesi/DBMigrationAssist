services:
  assessment-engine:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: db-migration-assessment:local
    container_name: db-migration-assessment
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-local-key-change-me}
      - DATAVERSE_URL=${DATAVERSE_URL:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - CALLBACK_WEBHOOK_URL=${CALLBACK_WEBHOOK_URL:-}
    volumes:
      - ../output:/app/output
      - ../input:/app/input
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
