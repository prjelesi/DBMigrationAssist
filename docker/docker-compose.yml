# ─────────────────────────────────────────────────────────────────────────────
# DB Migration Readiness — Local Docker Compose
#
# Services:
#   hub              Central assessment API (FastAPI)
#   agent-relational Collector for SQL Server, PostgreSQL, MySQL, MariaDB
#   agent-nosql      Collector for MongoDB, Cassandra
#   agent-oracle     Collector for Oracle (separate — heavier image)
#
# Usage:
#   docker compose up --build              # start hub + all agents
#   docker compose up hub agent-relational # start only what you need
#
# All agents auto-register with the hub on startup.
# Scale agents: docker compose up --scale agent-relational=3
# ─────────────────────────────────────────────────────────────────────────────

services:

  # ── Hub (Assessment API) ───────────────────────────────────────────────────
  hub:
    build:
      context: ..
      dockerfile: docker/Dockerfile
    image: db-migration-hub:local
    container_name: db-migration-hub
    ports:
      - "8000:8000"
    env_file:
      - .env
    environment:
      - API_KEY=${API_KEY:-dev-local-key-change-me}
      - DATAVERSE_URL=${DATAVERSE_URL:-}
      - AZURE_CLIENT_ID=${AZURE_CLIENT_ID:-}
      - AZURE_CLIENT_SECRET=${AZURE_CLIENT_SECRET:-}
      - AZURE_TENANT_ID=${AZURE_TENANT_ID:-}
      - CALLBACK_WEBHOOK_URL=${CALLBACK_WEBHOOK_URL:-}
    volumes:
      - ../output:/app/output
      - ../input:/app/input
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 20s
    networks:
      - dbmig

  # ── Relational Agent (SQL Server + PostgreSQL + MySQL + MariaDB) ───────────
  agent-relational:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: db-migration-agent:local
    container_name: db-migration-agent-relational
    environment:
      - HUB_URL=http://hub:8000
      - AGENT_NAME=agent-relational-01
      - AGENT_ROLES=sqlserver,postgresql,mysql,mariadb
      - HEARTBEAT_INTERVAL=30
      - POLL_INTERVAL=10
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dbmig

  # ── NoSQL Agent (MongoDB + Cassandra) ─────────────────────────────────────
  agent-nosql:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: db-migration-agent:local
    container_name: db-migration-agent-nosql
    environment:
      - HUB_URL=http://hub:8000
      - AGENT_NAME=agent-nosql-01
      - AGENT_ROLES=mongodb,cassandra
      - HEARTBEAT_INTERVAL=30
      - POLL_INTERVAL=10
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dbmig

  # ── Oracle Agent (separate — dedicated role) ───────────────────────────────
  agent-oracle:
    build:
      context: ..
      dockerfile: agent/Dockerfile
    image: db-migration-agent:local
    container_name: db-migration-agent-oracle
    environment:
      - HUB_URL=http://hub:8000
      - AGENT_NAME=agent-oracle-01
      - AGENT_ROLES=oracle
      - HEARTBEAT_INTERVAL=30
      - POLL_INTERVAL=10
    depends_on:
      hub:
        condition: service_healthy
    restart: unless-stopped
    networks:
      - dbmig

networks:
  dbmig:
    driver: bridge
