CollectJobsScreen As screen:
    Fill: =gColorNeutral
    OnVisible: =ClearCollect(colCollectJobs, DBMigrationHub.ListCollectionJobs())

    // ═══════════════════════════════════════════════════════════
    // HEADER + NAV (shared)
    // ═══════════════════════════════════════════════════════════
    Header_Rect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =64
        Fill: =gColorHeader
        BorderThickness: =0

    AppTitle_Lbl As label:
        X: =60
        Y: =0
        Width: =500
        Height: =64
        Text: ="DB Migration Readiness Assessment"
        Color: =gColorWhite
        Size: =18
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    NavBar_Rect As rectangle:
        X: =0
        Y: =64
        Width: =Parent.Width
        Height: =48
        Fill: =RGBA(16, 110, 190, 1)
        BorderThickness: =0

    NavHome_Btn As button:
        X: =0
        Y: =64
        Width: =160
        Height: =48
        Text: ="🏠  Dashboard"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)

    NavAssess_Btn As button:
        X: =160
        Y: =64
        Width: =180
        Height: =48
        Text: ="➕  New Assessment"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(NewAssessmentScreen, ScreenTransition.None)

    NavAgents_Btn As button:
        X: =340
        Y: =64
        Width: =160
        Height: =48
        Text: ="🤖  Agents"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(AgentsScreen, ScreenTransition.None)

    NavJobs_Btn As button:
        X: =500
        Y: =64
        Width: =180
        Height: =48
        Text: ="⚡  Collection Jobs"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =gColorWhite
        FontWeight: =FontWeight.Bold
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0

    NavReports_Btn As button:
        X: =680
        Y: =64
        Width: =160
        Height: =48
        Text: ="📊  Reports"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(ReportsScreen, ScreenTransition.None)

    // ═══════════════════════════════════════════════════════════
    // PAGE HEADER
    // ═══════════════════════════════════════════════════════════
    PageTitle_Lbl As label:
        X: =24
        Y: =128
        Width: =500
        Height: =36
        Text: ="⚡  Collection Jobs"
        FontWeight: =FontWeight.Bold
        Size: =20
        Color: =gColorText

    // Status filter buttons
    FilterAll_Btn As button:
        X: =24
        Y: =172
        Width: =80
        Height: =30
        Text: ="All"
        Fill: =If(IsBlank(gJobFilter), gColorPrimary, gColorWhite)
        Color: =If(IsBlank(gJobFilter), gColorWhite, gColorPrimary)
        BorderColor: =gColorPrimary
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =Set(gJobFilter, Blank())

    FilterPending_Btn As button:
        X: =112
        Y: =172
        Width: =90
        Height: =30
        Text: ="Pending"
        Fill: =If(gJobFilter = "pending", gColorWarning, gColorWhite)
        Color: =If(gJobFilter = "pending", gColorWhite, gColorWarning)
        BorderColor: =gColorWarning
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =Set(gJobFilter, "pending")

    FilterRunning_Btn As button:
        X: =210
        Y: =172
        Width: =90
        Height: =30
        Text: ="Running"
        Fill: =If(gJobFilter = "running", gColorPrimary, gColorWhite)
        Color: =If(gJobFilter = "running", gColorWhite, gColorPrimary)
        BorderColor: =gColorPrimary
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =Set(gJobFilter, "running")

    FilterCompleted_Btn As button:
        X: =308
        Y: =172
        Width: =100
        Height: =30
        Text: ="Completed"
        Fill: =If(gJobFilter = "completed", gColorSuccess, gColorWhite)
        Color: =If(gJobFilter = "completed", gColorWhite, gColorSuccess)
        BorderColor: =gColorSuccess
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =Set(gJobFilter, "completed")

    FilterFailed_Btn As button:
        X: =416
        Y: =172
        Width: =80
        Height: =30
        Text: ="Failed"
        Fill: =If(gJobFilter = "failed", gColorDanger, gColorWhite)
        Color: =If(gJobFilter = "failed", gColorWhite, gColorDanger)
        BorderColor: =gColorDanger
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =Set(gJobFilter, "failed")

    // Refresh + Auto-refresh timer
    RefreshJobs_Btn As button:
        X: =Parent.Width - 140
        Y: =134
        Width: =120
        Height: =36
        Text: ="🔄 Refresh"
        Fill: =gColorWhite
        Color: =gColorPrimary
        BorderColor: =gColorPrimary
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: =ClearCollect(colCollectJobs, DBMigrationHub.ListCollectionJobs())

    JobAutoRefresh_Timer As timer:
        Duration: =15000
        Repeat: =true
        Start: =true
        OnTimerEnd: =ClearCollect(colCollectJobs, DBMigrationHub.ListCollectionJobs())

    // ═══════════════════════════════════════════════════════════
    // COLUMN HEADERS
    // ═══════════════════════════════════════════════════════════
    ColHeader_Rect As rectangle:
        X: =24
        Y: =210
        Width: =Parent.Width - 48
        Height: =36
        Fill: =RGBA(237, 235, 233, 1)
        BorderColor: =gColorBorder
        BorderThickness: =1

    ColDB_Hdr As label:
        X: =36
        Y: =219
        Width: =220
        Height: =18
        Text: ="DATABASE"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColRole_Hdr As label:
        X: =264
        Y: =219
        Width: =120
        Height: =18
        Text: ="ROLE"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColHost_Hdr As label:
        X: =392
        Y: =219
        Width: =200
        Height: =18
        Text: ="HOST"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColStatus_Hdr As label:
        X: =600
        Y: =219
        Width: =110
        Height: =18
        Text: ="STATUS"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColAgent_Hdr As label:
        X: =720
        Y: =219
        Width: =200
        Height: =18
        Text: ="ASSIGNED AGENT"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColCreated_Hdr As label:
        X: =930
        Y: =219
        Width: =180
        Height: =18
        Text: ="CREATED"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    ColCompleted_Hdr As label:
        X: =1120
        Y: =219
        Width: =200
        Height: =18
        Text: ="COMPLETED"
        FontWeight: =FontWeight.Bold
        Size: =11
        Color: =gColorSubtext

    // ═══════════════════════════════════════════════════════════
    // JOBS GALLERY
    // ═══════════════════════════════════════════════════════════
    JobsGallery As gallery:
        X: =24
        Y: =246
        Width: =Parent.Width - 48
        Height: =Parent.Height - 262
        Items: =If(IsBlank(gJobFilter), colCollectJobs, Filter(colCollectJobs, status = gJobFilter))
        TemplateSize: =56
        TemplatePadding: =0

        Row_Bg As rectangle:
            X: =0
            Y: =0
            Width: =Parent.TemplateWidth
            Height: =Parent.TemplateHeight - 1
            Fill: =If(IsOdd(ThisItem.ItemIndex), gColorWhite, RGBA(250, 249, 248, 1))

        Row_Border As rectangle:
            X: =0
            Y: =Parent.TemplateHeight - 1
            Width: =Parent.TemplateWidth
            Height: =1
            Fill: =gColorBorder

        DBName_Lbl As label:
            X: =12
            Y: =8
            Width: =244
            Height: =22
            Text: =ThisItem.databaseName
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        JobId_Lbl As label:
            X: =12
            Y: =32
            Width: =244
            Height: =16
            Text: =Left(ThisItem.jobId, 12) & "…"
            Size: =10
            Color: =gColorSubtext

        Role_Badge As label:
            X: =264
            Y: =16
            Width: =120
            Height: =24
            Text: =Upper(ThisItem.role)
            Size: =11
            FontWeight: =FontWeight.Bold
            Color: =gColorPrimary
            Align: =Align.Center

        Host_Lbl As label:
            X: =392
            Y: =16
            Width: =200
            Height: =24
            Text: =ThisItem.host & If(!IsBlank(ThisItem.port), ":" & Text(ThisItem.port), "")
            Size: =12
            Color: =gColorText
            VerticalAlign: =VerticalAlign.Middle

        StatusBadge As label:
            X: =600
            Y: =14
            Width: =110
            Height: =28
            Text: =Upper(ThisItem.status)
            FontWeight: =FontWeight.Bold
            Size: =11
            Align: =Align.Center
            VerticalAlign: =VerticalAlign.Middle
            Color: =Switch(
                ThisItem.status,
                "completed", gColorSuccess,
                "failed",    gColorDanger,
                "running",   gColorPrimary,
                "pending",   gColorWarning,
                gColorSubtext
            )

        AssignedAgent_Lbl As label:
            X: =720
            Y: =16
            Width: =200
            Height: =24
            Text: =If(IsBlank(ThisItem.assignedAgentId), "—", Left(ThisItem.assignedAgentId, 12) & "…")
            Size: =11
            Color: =gColorSubtext
            VerticalAlign: =VerticalAlign.Middle

        Created_Lbl As label:
            X: =930
            Y: =16
            Width: =180
            Height: =24
            Text: =Text(DateTimeValue(ThisItem.createdAt), "[$-en-US]dd/mm/yy hh:mm")
            Size: =11
            Color: =gColorSubtext
            VerticalAlign: =VerticalAlign.Middle

        Completed_Lbl As label:
            X: =1120
            Y: =16
            Width: =200
            Height: =24
            Text: =If(IsBlank(ThisItem.completedAt), "—", Text(DateTimeValue(ThisItem.completedAt), "[$-en-US]dd/mm/yy hh:mm"))
            Size: =11
            Color: =If(ThisItem.status = "failed", gColorDanger, gColorSubtext)
            VerticalAlign: =VerticalAlign.Middle

    NoJobs_Lbl As label:
        X: =24
        Y: =380
        Width: =Parent.Width - 48
        Height: =80
        Text: ="No collection jobs found. Create a New Assessment with 'Run Live Collection' turned on."
        Size: =15
        Color: =gColorSubtext
        Align: =Align.Center
        VerticalAlign: =VerticalAlign.Middle
        Visible: =CountRows(colCollectJobs) = 0
