NewAssessmentScreen As screen:
    Fill: =gColorNeutral
    OnVisible: =Set(gAssessStep, 1); Reset(inp_DbName); Reset(inp_SourceVersion)

    // ═══════════════════════════════════════════════════════════
    // SHARED HEADER + NAV (same as HomeScreen)
    // ═══════════════════════════════════════════════════════════
    Header_Rect As rectangle:
        X: =0
        Y: =0
        Width: =Parent.Width
        Height: =64
        Fill: =gColorHeader
        BorderThickness: =0

    AppTitle_Lbl As label:
        X: =60
        Y: =0
        Width: =500
        Height: =64
        Text: ="DB Migration Readiness Assessment"
        Color: =gColorWhite
        Size: =18
        FontWeight: =FontWeight.Bold
        VerticalAlign: =VerticalAlign.Middle

    NavBar_Rect As rectangle:
        X: =0
        Y: =64
        Width: =Parent.Width
        Height: =48
        Fill: =RGBA(16, 110, 190, 1)
        BorderThickness: =0

    NavHome_Btn As button:
        X: =0
        Y: =64
        Width: =160
        Height: =48
        Text: ="🏠  Dashboard"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(HomeScreen, ScreenTransition.None)

    NavAssess_Btn As button:
        X: =160
        Y: =64
        Width: =180
        Height: =48
        Text: ="➕  New Assessment"
        Fill: =RGBA(0, 90, 158, 1)
        Color: =gColorWhite
        FontWeight: =FontWeight.Bold
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0

    NavAgents_Btn As button:
        X: =340
        Y: =64
        Width: =160
        Height: =48
        Text: ="🤖  Agents"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(AgentsScreen, ScreenTransition.None)

    NavJobs_Btn As button:
        X: =500
        Y: =64
        Width: =180
        Height: =48
        Text: ="⚡  Collection Jobs"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(CollectJobsScreen, ScreenTransition.None)

    NavReports_Btn As button:
        X: =680
        Y: =64
        Width: =160
        Height: =48
        Text: ="📊  Reports"
        Fill: =RGBA(16, 110, 190, 1)
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =0
        RadiusTopRight: =0
        RadiusBottomLeft: =0
        RadiusBottomRight: =0
        OnSelect: =Navigate(ReportsScreen, ScreenTransition.None)

    // ═══════════════════════════════════════════════════════════
    // STEP WIZARD HEADER
    // ═══════════════════════════════════════════════════════════
    WizardTitle_Lbl As label:
        X: =24
        Y: =128
        Width: =600
        Height: =36
        Text: ="New Assessment — Step " & gAssessStep & " of 3"
        FontWeight: =FontWeight.Bold
        Size: =18
        Color: =gColorText

    // Step indicators
    Step1_Rect As rectangle:
        X: =24
        Y: =170
        Width: =160
        Height: =6
        Fill: =If(gAssessStep >= 1, gColorPrimary, gColorBorder)
        RadiusTopLeft: =3
        RadiusTopRight: =3
        RadiusBottomLeft: =3
        RadiusBottomRight: =3

    Step1_Lbl As label:
        X: =24
        Y: =180
        Width: =160
        Height: =20
        Text: ="1  Database Info"
        Size: =11
        Color: =If(gAssessStep = 1, gColorPrimary, gColorSubtext)
        Align: =Align.Center

    Step2_Rect As rectangle:
        X: =200
        Y: =170
        Width: =160
        Height: =6
        Fill: =If(gAssessStep >= 2, gColorPrimary, gColorBorder)
        RadiusTopLeft: =3
        RadiusTopRight: =3
        RadiusBottomLeft: =3
        RadiusBottomRight: =3

    Step2_Lbl As label:
        X: =200
        Y: =180
        Width: =160
        Height: =20
        Text: ="2  Migration Details"
        Size: =11
        Color: =If(gAssessStep = 2, gColorPrimary, gColorSubtext)
        Align: =Align.Center

    Step3_Rect As rectangle:
        X: =376
        Y: =170
        Width: =160
        Height: =6
        Fill: =If(gAssessStep >= 3, gColorPrimary, gColorBorder)
        RadiusTopLeft: =3
        RadiusTopRight: =3
        RadiusBottomLeft: =3
        RadiusBottomRight: =3

    Step3_Lbl As label:
        X: =376
        Y: =180
        Width: =160
        Height: =20
        Text: ="3  Technical Details"
        Size: =11
        Color: =If(gAssessStep = 3, gColorPrimary, gColorSubtext)
        Align: =Align.Center

    // ═══════════════════════════════════════════════════════════
    // FORM CARD BACKGROUND
    // ═══════════════════════════════════════════════════════════
    FormCard_Rect As rectangle:
        X: =24
        Y: =210
        Width: =900
        Height: =490
        Fill: =gColorWhite
        BorderColor: =gColorBorder
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4

    // ═══════════════════════════════════════════════════════════
    // STEP 1 — Database Info
    // ═══════════════════════════════════════════════════════════
    Step1_Group As group:
        Visible: =gAssessStep = 1

        DbName_Lbl As label:
            X: =48
            Y: =230
            Width: =200
            Height: =24
            Text: ="Database Name *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        inp_DbName As textinput:
            X: =48
            Y: =256
            Width: =400
            Height: =40
            HintText: ="e.g. AdventureWorks"
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        SourceType_Lbl As label:
            X: =48
            Y: =312
            Width: =200
            Height: =24
            Text: ="Source DB Type *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_SourceType As dropdown:
            X: =48
            Y: =338
            Width: =300
            Height: =40
            Items: =["SQL Server","Oracle","PostgreSQL","MySQL","MariaDB","MongoDB","Cassandra","SybaseASE"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        SourceVersion_Lbl As label:
            X: =48
            Y: =394
            Width: =200
            Height: =24
            Text: ="Version"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        inp_SourceVersion As textinput:
            X: =48
            Y: =420
            Width: =200
            Height: =40
            HintText: ="e.g. 2019, 19c, 14"
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        SourceEnv_Lbl As label:
            X: =48
            Y: =476
            Width: =200
            Height: =24
            Text: ="Source Environment *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_SourceEnv As dropdown:
            X: =48
            Y: =502
            Width: =400
            Height: =40
            Items: =["OnPrem","AzureVM","AzureVM_Windows","AzureVM_Linux","AWS_EC2","AWS_RDS","AWS_Aurora","GCP_CloudSQL","OracleCloud","AzureArc"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        CustomerName_Lbl As label:
            X: =480
            Y: =230
            Width: =200
            Height: =24
            Text: ="Customer / Company"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        inp_CustomerName As textinput:
            X: =480
            Y: =256
            Width: =400
            Height: =40
            Default: =gCustomer
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        TargetType_Lbl As label:
            X: =480
            Y: =312
            Width: =200
            Height: =24
            Text: ="Target Azure Service"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_TargetType As dropdown:
            X: =480
            Y: =338
            Width: =400
            Height: =40
            Items: =["Undecided","Azure SQL Database","Azure SQL Managed Instance","SQL Server on Azure VM","Azure Database for PostgreSQL Flex","Azure Database for MySQL Flex","Azure Database for MariaDB","Azure Cosmos DB for MongoDB","Azure Managed Instance for Apache Cassandra","Azure Database Migration Service"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        DbCount_Lbl As label:
            X: =480
            Y: =394
            Width: =200
            Height: =24
            Text: ="Number of Databases"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        inp_DbCount As textinput:
            X: =480
            Y: =420
            Width: =120
            Height: =40
            Default: ="1"
            Format: =TextInputFormat.Number
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

    // ═══════════════════════════════════════════════════════════
    // STEP 2 — Migration Details
    // ═══════════════════════════════════════════════════════════
    Step2_Group As group:
        Visible: =gAssessStep = 2

        MaxDowntime_Lbl As label:
            X: =48
            Y: =230
            Width: =300
            Height: =24
            Text: ="Maximum Acceptable Downtime *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_MaxDowntime As dropdown:
            X: =48
            Y: =256
            Width: =280
            Height: =40
            Items: =["zero — No downtime (online migration)","hours — A few hours","days — Multiple days acceptable"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        Connectivity_Lbl As label:
            X: =48
            Y: =312
            Width: =300
            Height: =24
            Text: ="Network Connectivity to Azure *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_Connectivity As dropdown:
            X: =48
            Y: =338
            Width: =280
            Height: =40
            Items: =["expressroute — ExpressRoute","vpn — Site-to-Site VPN","internet — Public Internet","none — No connectivity yet"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        LandingZone_Lbl As label:
            X: =48
            Y: =394
            Width: =300
            Height: =24
            Text: ="Azure Landing Zone Ready? *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_LandingZone As dropdown:
            X: =48
            Y: =420
            Width: =280
            Height: =40
            Items: =["yes — Fully ready","partial — Work in progress","no — Not started"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        DataSize_Lbl As label:
            X: =400
            Y: =230
            Width: =300
            Height: =24
            Text: ="Data Size *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_DataSize As dropdown:
            X: =400
            Y: =256
            Width: =280
            Height: =40
            Items: =["small — Under 100 GB","medium — 100 GB – 1 TB","large — Over 1 TB"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        RunCollection_Lbl As label:
            X: =400
            Y: =312
            Width: =300
            Height: =24
            Text: ="Run Live Data Collection?"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        RunCollection_Info As label:
            X: =400
            Y: =338
            Width: =460
            Height: =44
            Text: ="If ON, a collector agent will connect to the database and gather real metrics (versions, object counts, size). Requires an agent with the matching role to be online."
            Size: =11
            Color: =gColorSubtext
            VerticalAlign: =VerticalAlign.Top

        tgl_RunCollection As toggle:
            X: =400
            Y: =390
            Width: =80
            Height: =32
            Default: =false
            OnChange: =Set(gRunCollection, Self.Value)

        RunCollection_Val_Lbl As label:
            X: =490
            Y: =396
            Width: =120
            Height: =20
            Text: =If(gRunCollection, "Yes — collect live", "No — questionnaire only")
            Size: =12
            Color: =If(gRunCollection, gColorSuccess, gColorSubtext)
            VerticalAlign: =VerticalAlign.Middle

        // Connection details (only visible when live collection is on)
        ConnDetails_Group As group:
            Visible: =gRunCollection

            Host_Lbl As label:
                X: =400
                Y: =432
                Width: =120
                Height: =24
                Text: ="Host / IP *"
                FontWeight: =FontWeight.Bold
                Size: =12
                Color: =gColorText

            inp_Host As textinput:
                X: =400
                Y: =456
                Width: =240
                Height: =36
                HintText: ="10.0.1.4 or myserver.domain.com"
                BorderColor: =gColorBorder
                RadiusTopLeft: =4
                RadiusTopRight: =4
                RadiusBottomLeft: =4
                RadiusBottomRight: =4

            Port_Lbl As label:
                X: =652
                Y: =432
                Width: =60
                Height: =24
                Text: ="Port"
                FontWeight: =FontWeight.Bold
                Size: =12
                Color: =gColorText

            inp_Port As textinput:
                X: =652
                Y: =456
                Width: =100
                Height: =36
                HintText: ="1433"
                Format: =TextInputFormat.Number
                BorderColor: =gColorBorder
                RadiusTopLeft: =4
                RadiusTopRight: =4
                RadiusBottomLeft: =4
                RadiusBottomRight: =4

            Username_Lbl As label:
                X: =400
                Y: =500
                Width: =120
                Height: =24
                Text: ="Username"
                FontWeight: =FontWeight.Bold
                Size: =12
                Color: =gColorText

            inp_Username As textinput:
                X: =400
                Y: =524
                Width: =180
                Height: =36
                HintText: ="sa / demouser"
                BorderColor: =gColorBorder
                RadiusTopLeft: =4
                RadiusTopRight: =4
                RadiusBottomLeft: =4
                RadiusBottomRight: =4

            Password_Lbl As label:
                X: =592
                Y: =500
                Width: =120
                Height: =24
                Text: ="Password"
                FontWeight: =FontWeight.Bold
                Size: =12
                Color: =gColorText

            inp_Password As textinput:
                X: =592
                Y: =524
                Width: =180
                Height: =36
                HintText: ="••••••••"
                Mode: =TextInputMode.Password
                BorderColor: =gColorBorder
                RadiusTopLeft: =4
                RadiusTopRight: =4
                RadiusBottomLeft: =4
                RadiusBottomRight: =4

    // ═══════════════════════════════════════════════════════════
    // STEP 3 — Technical Details
    // ═══════════════════════════════════════════════════════════
    Step3_Group As group:
        Visible: =gAssessStep = 3

        StoredProcs_Lbl As label:
            X: =48
            Y: =230
            Width: =300
            Height: =24
            Text: ="Stored Procedures / Functions *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_StoredProcs As dropdown:
            X: =48
            Y: =256
            Width: =280
            Height: =40
            Items: =["none — None","few — A few (< 20)","many — Many (20–200)","extensive — Extensive (200+)"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        Dependencies_Lbl As label:
            X: =48
            Y: =312
            Width: =300
            Height: =24
            Text: ="Dependencies"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        chk_LinkedServers As checkbox:
            X: =48
            Y: =342
            Width: =200
            Height: =28
            Text: ="Linked Servers"
            Size: =13
            OnChange: =Set(gDep_LS, Self.Value)

        chk_SSIS As checkbox:
            X: =48
            Y: =372
            Width: =200
            Height: =28
            Text: ="SSIS / ETL Jobs"
            Size: =13
            OnChange: =Set(gDep_SSIS, Self.Value)

        chk_Replication As checkbox:
            X: =48
            Y: =402
            Width: =200
            Height: =28
            Text: ="Replication"
            Size: =13
            OnChange: =Set(gDep_Repl, Self.Value)

        chk_CDC As checkbox:
            X: =48
            Y: =432
            Width: =200
            Height: =28
            Text: ="CDC / Change Tracking"
            Size: =13
            OnChange: =Set(gDep_CDC, Self.Value)

        TeamSkill_Lbl As label:
            X: =400
            Y: =230
            Width: =300
            Height: =24
            Text: ="Team Azure / Cloud Skill *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_TeamSkill As dropdown:
            X: =400
            Y: =256
            Width: =280
            Height: =40
            Items: =["expert — Deep Azure expertise","moderate — Some Azure experience","beginner — Limited cloud experience"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

        RollbackPlan_Lbl As label:
            X: =400
            Y: =312
            Width: =300
            Height: =24
            Text: ="Rollback Plan *"
            FontWeight: =FontWeight.Bold
            Size: =13
            Color: =gColorText

        drp_RollbackPlan As dropdown:
            X: =400
            Y: =338
            Width: =280
            Height: =40
            Items: =["yes_tested — Yes, tested","yes_untested — Yes, not tested","partial — Partial plan","no — No rollback plan"]
            BorderColor: =gColorBorder
            RadiusTopLeft: =4
            RadiusTopRight: =4
            RadiusBottomLeft: =4
            RadiusBottomRight: =4

    // ═══════════════════════════════════════════════════════════
    // VALIDATION MESSAGE
    // ═══════════════════════════════════════════════════════════
    Validation_Lbl As label:
        X: =48
        Y: =650
        Width: =700
        Height: =30
        Text: =gValidationMsg
        Color: =gColorDanger
        Size: =13
        Visible: =!IsBlank(gValidationMsg)

    // ═══════════════════════════════════════════════════════════
    // NAVIGATION BUTTONS
    // ═══════════════════════════════════════════════════════════
    BackBtn As button:
        X: =48
        Y: =660
        Width: =140
        Height: =40
        Text: ="← Back"
        Fill: =gColorWhite
        Color: =gColorPrimary
        BorderColor: =gColorPrimary
        BorderThickness: =1
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        Visible: =gAssessStep > 1
        OnSelect: =Set(gAssessStep, gAssessStep - 1); Set(gValidationMsg, "")

    NextBtn As button:
        X: =760
        Y: =660
        Width: =160
        Height: =40
        Text: =If(gAssessStep < 3, "Next →", "Submit Assessment")
        Fill: =gColorPrimary
        Color: =gColorWhite
        BorderThickness: =0
        RadiusTopLeft: =4
        RadiusTopRight: =4
        RadiusBottomLeft: =4
        RadiusBottomRight: =4
        OnSelect: |-
            =If(
                // Step 1 validation
                gAssessStep = 1 && (IsBlank(inp_DbName.Text) || IsBlank(drp_SourceType.Selected.Value) || IsBlank(drp_SourceEnv.Selected.Value)),
                    Set(gValidationMsg, "Please fill in all required fields (Database Name, Source Type, Source Environment)."),

                // Step 2 validation
                gAssessStep = 2 && (IsBlank(drp_MaxDowntime.Selected.Value) || IsBlank(drp_Connectivity.Selected.Value) || IsBlank(drp_LandingZone.Selected.Value) || IsBlank(drp_DataSize.Selected.Value)),
                    Set(gValidationMsg, "Please fill in all required migration detail fields."),

                // Advance step
                gAssessStep < 3,
                    Sequence(Set(gAssessStep, gAssessStep + 1), Set(gValidationMsg, "")),

                // SUBMIT (Step 3)
                true,
                    Sequence(
                        Set(gValidationMsg, ""),
                        Set(gSubmitting, true),
                        // Build dependencies string
                        Set(gDepsStr, Concat(
                            Filter(
                                ["linked_servers","ssis","replication","cdc"],
                                (Value = "linked_servers" && gDep_LS) ||
                                (Value = "ssis" && gDep_SSIS) ||
                                (Value = "replication" && gDep_Repl) ||
                                (Value = "cdc" && gDep_CDC)
                            ),
                            Value, "|"
                        )),
                        // Submit assessment
                        Set(gLastJob,
                            DBMigrationHub.StartAssessment({
                                customerName: inp_CustomerName.Text,
                                requestedBy:  User().FullName,
                                databases: [
                                    {
                                        DatabaseName:      inp_DbName.Text,
                                        SourceType:        Left(drp_SourceType.Selected.Value, Find(" ",drp_SourceType.Selected.Value & " ") - 1),
                                        SourceVersion:     inp_SourceVersion.Text,
                                        SourceEnvironment: Left(drp_SourceEnv.Selected.Value, Find(" ",drp_SourceEnv.Selected.Value & " ") - 1),
                                        TargetType:        drp_TargetType.Selected.Value,
                                        MaxDowntime:       Left(drp_MaxDowntime.Selected.Value, Find(" ",drp_MaxDowntime.Selected.Value) - 1),
                                        Connectivity:      Left(drp_Connectivity.Selected.Value, Find(" ",drp_Connectivity.Selected.Value) - 1),
                                        LandingZone:       Left(drp_LandingZone.Selected.Value, Find(" ",drp_LandingZone.Selected.Value) - 1),
                                        DataSize:          Left(drp_DataSize.Selected.Value, Find(" ",drp_DataSize.Selected.Value) - 1),
                                        StoredProcs:       Left(drp_StoredProcs.Selected.Value, Find(" ",drp_StoredProcs.Selected.Value) - 1),
                                        Dependencies:      gDepsStr,
                                        TeamSkill:         Left(drp_TeamSkill.Selected.Value, Find(" ",drp_TeamSkill.Selected.Value) - 1),
                                        RollbackPlan:      Left(drp_RollbackPlan.Selected.Value, Find(" ",drp_RollbackPlan.Selected.Value) - 1),
                                        DatabaseCount:     Value(inp_DbCount.Text)
                                    }
                                ],
                                runInfoGather: gRunCollection
                            })
                        ),
                        Set(gSubmitting, false),
                        Navigate(ReportsScreen, ScreenTransition.Fade),
                        Notify("Assessment queued — Job ID: " & gLastJob.jobId, NotificationType.Success)
                    )
            )

    Submitting_Lbl As label:
        X: =760
        Y: =614
        Width: =200
        Height: =28
        Text: ="Submitting…"
        Size: =13
        Color: =gColorSubtext
        Visible: =gSubmitting
